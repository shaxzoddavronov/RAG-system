services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Ollama runs natively on the host, not in a container: GPU passthrough
      # into Docker needs nvidia-container-toolkit, which is painful on Windows
      # and would leave most PMs on CPU anyway.
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      # Docker Desktop provides host.docker.internal; on Linux we must map it.
      - "host.docker.internal:host-gateway"
    volumes:
      # Without this, every `docker compose down` throws away 4.6 GB of model
      # weights and the next start silently re-downloads them.
      - hf-cache:/cache/huggingface
    restart: unless-stopped

volumes:
  hf-cache:

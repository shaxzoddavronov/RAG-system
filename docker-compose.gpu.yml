# GPU overlay. Never used alone -- layer it on top of the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# `make up` adds it automatically when nvidia-smi is on PATH, so on Linux and
# macOS you normally never type this. On Windows (no make) use the line above.
#
# Two things change: torch is installed from a CUDA wheel index instead of the
# CPU one, and the container is actually given the device. Both are required --
# a CUDA build with no device reservation still reports cuda unavailable, and a
# device reservation with CPU-only torch cannot use it.
#
# Requires nvidia-container-toolkit on Linux, or Docker Desktop on the WSL2
# backend on Windows. Without either, compose refuses to start -- which is why
# this is an opt-in overlay and not part of docker-compose.yml.
services:
  api:
    build:
      args:
        # Must match the CUDA version your driver supports. Check with
        # `nvidia-smi` and pick the matching index from pytorch.org; cu126 and
        # cu130 also exist for torch 2.9.1. Override without editing this file:
        #   TORCH_INDEX=https://download.pytorch.org/whl/cu126 docker compose ...
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu128}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
